name: Update Matches Data

on:
  schedule:
    - cron: '0 6 * * *'  # Exécution quotidienne à 6h00 UTC
  workflow_dispatch:     # Permet un lancement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run update script
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          python scripts/update_matches.py

      - name: Commit and push updated matches
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/matches.json
          git diff --staged --quiet || git commit -m "chore: update matches.json [skip ci]"
          git push
