<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrenchiesWBB - Test API-Sports Widgets</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    
    <!-- API-Sports Widgets Script -->
    <script type="module" crossorigin src="https://widgets.api-sports.io/3.1.0/widgets.js"></script>

    <style>
        body { margin: 0; background-color: #090d16; }
        .container-fluid, .content { max-width: 1440px; margin: auto; }
        #game-content, #leagues-list { position: sticky; top: 70px; overflow-y: auto; max-height: calc(100vh - 100px); }
        #standings-content api-sports-widget, #team-content api-sports-widget { margin-bottom: 1rem; max-height: 55vh; }
    </style>
</head>
<body>

    <!-- Barre de navigation avec sélecteur de sport -->
    <nav class="header navbar navbar-expand-lg bg-body-tertiary sticky-top border-bottom border-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-white" href="#">FrenchiesWBB 🏀 <span class="text-indigo-400 fs-6">Widgets API-Sports</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" data-sport="football" href="#">Football</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold text-warning" data-sport="basketball" href="#">Basketball</a></li>
                    <li class="nav-item"><a class="nav-link" data-sport="baseball" href="#">Baseball</a></li>
                    <li class="nav-item"><a class="nav-link" data-sport="rugby" href="#">Rugby</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenu principal avec la grille Bootstrap -->
    <div class="content p-3">
        <div class="row g-3">
            <!-- Colonne 1 : Liste des Ligues/Compétitions -->
            <div class="col-12 col-md-3">
                <div id="leagues-list" class="card text-bg-dark border-secondary rounded-4 shadow">
                    <div class="card-body p-0">
                        <api-sports-widget data-type="leagues"></api-sports-widget>
                    </div>
                </div>
            </div>

            <!-- Colonne 2 : Liste des Matchs / Fixtures -->
            <div class="col-12 col-md-5">
                <div id="games-list" class="card text-bg-dark border-secondary rounded-4 shadow">
                    <div class="card-body p-0">
                        <api-sports-widget data-type="games"></api-sports-widget>
                    </div>
                </div>
            </div>

            <!-- Colonne 3 : Conteneurs de ciblage dynamique (Classements, Équipes, Détails match) -->
            <div class="col-12 col-md-4">
                <div class="card text-bg-dark border-secondary rounded-4 shadow mb-3">
                    <div class="card-body p-0">
                        <div id="standings-content"></div>
                    </div>
                </div>
                <div class="card text-bg-dark border-secondary rounded-4 shadow mb-3">
                    <div class="card-body p-0">
                        <div id="team-content"></div>
                    </div>
                </div>
                <div id="game-content" class="card text-bg-dark border-secondary rounded-4 shadow">
                    <div class="card-body p-0">
                        <api-sports-widget data-type="game" data-game-id="1"></api-sports-widget>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Widget de Configuration Globale (Clé API & Cibles dynamiques) -->
    <api-sports-widget 
        data-type="config" 
        data-sport="basketball" 
        data-key="VOTRE_CLE_API_SPORTS" 
        data-lang="fr" 
        data-theme="grey" 
        data-show-error="true" 
        data-show-logos="true" 
        data-refresh="30" 
        data-favorite="true" 
        data-standings="true" 
        data-team-squad="true" 
        data-team-statistics="true" 
        data-player-statistics="true" 
        data-tab="games" 
        data-game-tab="statistics" 
        data-target-player="modal" 
        data-target-league="#games-list" 
        data-target-team="#team-content" 
        data-target-game="#game-content .card-body" 
        data-target-standings="#standings-content">
    </api-sports-widget>

    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

    <!-- Script de gestion du changement de sport à la volée -->
    <script>
        document.addEventListener('click', function (event) {
            if (!event.target.matches('.nav-link')) return;
            event.preventDefault();
            
            // Mise à jour de la classe active sur la navbar
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active', 'fw-bold', 'text-warning'));
            event.target.classList.add('active', 'fw-bold', 'text-warning');

            let sport = event.target.getAttribute('data-sport');
            
            // Mise à jour de la configuration globale
            let widget = document.querySelector('api-sports-widget[data-type="config"]');
            widget.setAttribute('data-sport', sport);

            // Rechargement des widgets principaux
            ['leagues', 'games', 'game'].forEach(type => {
                let el = document.querySelector(`api-sports-widget[data-type="${type}"]`);
                if (el) {
                    el.innerHTML = '';
                    el.setAttribute('data-sport', sport);
                    if (typeof el.connectedCallback === 'function') {
                        el.connectedCallback();
                    }
                }
            });

            window.document.dispatchEvent(new Event("DOMContentLoaded", { bubbles: true, cancelable: true }));
        });
    </script>
</body>
</html>
