<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrenchiesWBB — Agenda des joueuses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="module" crossorigin src="https://widgets.api-sports.io/3.1.0/widgets.js"></script>
    <style>
        body { background-color: #090d16; }
        .card { background-color: #111827; border: 1px solid #1f2937; }
    </style>
</head>
<body>
    <div class="container py-5">
        <header class="mb-5 border-bottom border-secondary pb-3">
            <h1 class="fw-bold text-white">FrenchiesWBB — Agenda des joueuses</h1>
            <p class="text-muted mb-0">Suivi des effectifs et des clubs multi-ligues[cite: 2]</p>
        </header>
        <div id="players-schedule" class="row g-4"></div>
    </div>

    <api-sports-widget 
        data-type="config" 
        data-sport="basketball" 
        data-key="V76b13f64dbc947d5ccae41a2db2cafb" 
        data-lang="fr" 
        data-theme="grey" 
        data-show-error="true">
    </api-sports-widget>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadSchedule() {
            try {
                const response = await fetch('../data/joueuses.json');
                const data = await response.json();
                const container = document.getElementById('players-schedule');

                container.innerHTML = data.players.map(player => `
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="card h-100 rounded-4 p-3 shadow-sm">
                            <div class="card-body">
                                <h5 class="fw-bold text-white mb-2">${player.first_name} ${player.last_name}</h5>
                                <p class="text-muted small mb-3">Poste ${player.positions.join('/')}</p>
                                <ul class="list-unstyled small text-secondary mb-3">
                                    <li>WNBA : <span class="text-white">${player.clubs.wnba_franchise || 'Aucun'}</span></li>
                                    <li>Unrivaled : <span class="text-white">${player.clubs.unrivaled_league || 'Aucun'}</span></li>
                                    <li>Europe : <span class="text-white">${player.clubs.european_club || 'Aucun'}</span></li>
                                    <li>Project B : <span class="text-white">${player.clubs.project_b_league || 'Aucun'}</span></li>
                                </ul>
                                <div class="bg-dark p-2 rounded text-muted small">
                                    Calendrier lié aux clubs ci-dessus via API-Sports
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Erreur de chargement :', error);
            }
        }
        loadSchedule();
    </script>
</body>
</html>
