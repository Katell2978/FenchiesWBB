<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrenchiesWBB — Agenda des joueuses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #090d16; }
        .card { background-color: #111827; border: 1px solid #1f2937; }
    </style>
</head>
<body>
    <div class="container py-5">
        <header class="mb-5 border-bottom border-secondary pb-3">
            <h1 class="fw-bold text-white">FrenchiesWBB — Agenda des joueuses</h1>
            <p class="text-muted mb-0">Suivi des clubs et de l'Équipe de France</p>
        </header>
        <div id="players-schedule" class="row g-4"></div>
    </div>

    <script>
        async function loadSchedule() {
            try {
                const [rosterRes, matchesRes] = await Promise.all([
                    fetch('../data/joueuses.json'),
                    fetch('../data/matches.json')
                ]);
                
                const roster = await rosterRes.json();
                const matchesData = await matchesRes.json();
                
                // Indexation des matchs de clubs par team_id
                const clubMatchesMap = {};
                (matchesData.matches || []).forEach(item => {
                    clubMatchesMap[item.team_id] = item.upcoming_games;
                });

                const now = new Date();
                const nationalGames = (matchesData.national_team_games || []).filter(g => new Date(g.date) >= now);

                const container = document.getElementById('players-schedule');

                container.innerHTML = roster.players.map(player => {
                    let clubInfo = player.clubs.european_club || player.clubs.wnba_franchise || player.clubs.unrivaled_league || player.clubs.project_b_league;
                    let clubName = typeof clubInfo === 'object' && clubInfo !== null ? clubInfo.name : clubInfo;
                    let teamId = typeof clubInfo === 'object' && clubInfo !== null ? clubInfo.team_id : null;
                    
                    let scheduleHtml = '';

                    // Matchs Équipe de France si la joueuse est sélectionnée en senior
                    if (player.selections && player.selections.senior_team && nationalGames.length > 0) {
                        scheduleHtml += `<div class="mb-2"><strong class="text-warning small">Équipe de France :</strong>`;
                        nationalGames.forEach(g => {
                            scheduleHtml += `
                                <div class="text-white small ms-2">
                                    • <strong>${new Date(g.date).toLocaleDateString('fr-FR', {day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit'})}</strong> : ${g.home} vs ${g.away}
                                </div>`;
                        });
                        scheduleHtml += `</div>`;
                    }

                    // Matchs de club
                    let clubGamesHtml = '<span class="text-muted small">Aucun match de club planifié</span>';
                    if (teamId && clubMatchesMap[teamId] && clubMatchesMap[teamId].length > 0) {
                        clubGamesHtml = clubMatchesMap[teamId].map(g => `
                            <div class="text-white small ms-2">
                                • <strong>${new Date(g.date).toLocaleDateString('fr-FR', {day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit'})}</strong> : ${g.home} vs ${g.away}
                            </div>
                        `).join('');
                    }

                    scheduleHtml += `<div><strong class="text-info small">Club (${clubName || 'Aucun'}) :</strong>${clubGamesHtml}</div>`;

                    return `
                        <div class="col-12 col-md-6 col-lg-4">
                            <div class="card h-100 rounded-4 p-3 shadow-sm">
                                <div class="card-body">
                                    <h5 class="fw-bold text-white mb-1">${player.first_name} ${player.last_name}</h5>
                                    <p class="text-muted small mb-2">Poste : ${player.positions.join('/')}</p>
                                    <hr class="border-secondary">
                                    <div class="small">
                                        ${scheduleHtml}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Erreur de chargement :', error);
            }
        }
        loadSchedule();
    </script>
</body>
</html>
